[package]
name = "k"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diesel = { version = "2.2.0", features = ["postgres", "r2d2"] }
r2d2 = "0.8.10"
dotenvy = "0.15"
viperus = "0.1.10"
log = "0.4"
env_logger = "0.11.5"
chrono = { version = "0.4", features = ["serde"] }