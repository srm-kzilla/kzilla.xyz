[package]
name = "k"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
viperus = "0.1.10"
log = "0.4"
env_logger = "0.11.5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0.29"
sqlx = { version = "0.8.2", features = ["runtime-tokio-native-tls", "macros", "postgres", "time", "chrono"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "7"
